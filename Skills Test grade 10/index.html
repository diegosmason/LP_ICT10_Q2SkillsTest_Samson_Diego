<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Checker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />

</head>

<body>



  <body style="overflow: hidden">



    <py-script src="main.py"></py-script>

    <style>
      .container {
        padding-top: 3px;
        padding-bottom: 20px;
      }

      .main-card {
        border: none;
        border-radius: 0px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header {
        background: #080808;
        color: white;
        padding: 10px;
        text-align: center;
        border: #f1f1f1;
      }

      .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        object-position: 50% 20%;
        z-index: -1;
      }


      .info-card {
        border: no;
        border-radius: 10px;
        height: 100%;
        transition: transform 0.2s;
      }

      .info-card:hover {
        transform: translateY(-5px);
      }

      .info-title {
        color: #fcfcfc;
        font-weight: bold;
      }

      .data-value {
        font-size: 1.1rem;
      }

      .badge-custom {
        background-color: #f9f8f8;
      }

      footer {
        text-align: center;
        color: white;
        margin-top: 100px;
      }
    </style>

<div class="w-100 h-100">

        <img src="51ce5a405a1e841c9809ac18bd3b4d6b.png"
            style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: -10; object-fit: cover;">


    </div>



      <div class="card-body p-4">
        <div class="row g-4">
          <div class="content-backdrop">

            <h1 style="color: rgb(255, 255, 255); font-family: monospace ''; font-weight: 400;">
              Element Checker </h1>
            <br>

            <form onsubmit="return false;">
              <input type="text" id="first_name" placeholder="Type here "><br><br>
              <br>
              <input type="button" py-click="element_checker" value="Enter"><br><br>
              <div id="result" style="color: black;"> </div>

            </form>


          </div>

          <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  </body>

</html>
